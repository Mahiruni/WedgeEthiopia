openapi: 3.1.0
info:
  title: Wedge Ethiopia ERP API
  version: 0.1.0
  description: Country-neutral ERP surface for fiscal invoice orchestration. Authority-specific fields remain behind the fiscal adapter.
servers:
  - url: https://api.example.et/api/v1
security:
  - ApiKey: []
components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
    InvoiceLineInput:
      type: object
      required: [description, quantity_milli, unit_price_minor, tax_rate_bps]
      properties:
        sku: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        quantity_milli: { type: integer, minimum: 1, description: Quantity scaled by 1000 }
        unit_price_minor: { type: integer, minimum: 0, description: Minor currency units }
        tax_code: { type: string, maxLength: 80 }
        tax_rate_bps: { type: integer, minimum: 0, description: Tax rate in basis points; authoritative values remain regulator/customer configuration }
    InvoiceCreate:
      type: object
      required: [legal_entity_id, source_ref, lines]
      properties:
        legal_entity_id: { type: string, format: uuid }
        branch_id: { type: string, format: uuid }
        counterparty_id: { type: string, format: uuid }
        source_ref: { type: string, maxLength: 160 }
        currency: { type: string, minLength: 3, maxLength: 3, default: ETB }
        lines:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/InvoiceLineInput' }
paths:
  /health:
    get:
      security: []
      responses:
        '200': { description: Healthy }
  /invoices:
    get:
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - in: query
          name: updated_since
          description: ISO-8601 timestamp for incremental ERP synchronization.
          schema: { type: string, format: date-time }
      responses:
        '200': { description: Tenant-scoped invoice collection }
    post:
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvoiceCreate' }
      responses:
        '201': { description: Validated invoice created }
        '400': { description: Invalid payload }
        '401': { description: Invalid API key }
        '403': { description: Missing scope }
        '409': { description: Duplicate source reference or conflicting idempotency key }
  /invoices/{id}:
    get:
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Invoice including invoice lines }
        '404': { description: Not found }
  /invoices/{id}/submit:
    post:
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Fiscal authority accepted invoice }
        '409': { description: Invoice is not in a submit-eligible state }
        '422': { description: Fiscal authority rejected invoice }
        '503': { description: Production fiscal adapter not configured }
  /invoices/{id}/credit-notes:
    post:
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '501': { description: Blocked until official regulator correction-document mapping is supplied }
  /invoices/{id}/debit-notes:
    post:
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '501': { description: Blocked until official regulator correction-document mapping is supplied }
  /fiscal/submissions/{id}:
    get:
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Tenant-scoped fiscal submission status }
        '404': { description: Not found }
  /legal-entities:
    get:
      responses:
        '200': { description: Tenant legal entities }
  /counterparties:
    get:
      responses:
        '200': { description: Tenant counterparties }
    post:
      responses:
        '201': { description: Counterparty created }
  /counterparties/resolve:
    get:
      parameters:
        - in: query
          name: tin
          required: true
          schema: { type: string }
      responses:
        '200': { description: Tenant counterparty match }
        '404': { description: Not found }
  /identity/sessions:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: { type: string, format: uuid, description: Existing active tenant member to bind after verified eSignet callback }
      responses:
        '200': { description: eSignet authorization URL and expiring server-side session }
        '404': { description: Tenant member not found }
        '503': { description: eSignet relying-party or encryption configuration missing }
  /webhook-endpoints:
    get:
      responses: { '200': { description: Webhook endpoints } }
    post:
      responses: { '201': { description: Webhook endpoint created } }
