name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fiscal_rail_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ALLOW_DEMO_MODE: "true"
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Domain rules
        run: npm run domain:check
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Bootstrap PostgreSQL test roles
        run: psql -h localhost -U postgres -d fiscal_rail_test -v ON_ERROR_STOP=1 -f supabase/test-bootstrap.sql
      - name: Apply schema
        run: psql -h localhost -U postgres -d fiscal_rail_test -v ON_ERROR_STOP=1 -f supabase/schema.sql
      - name: Database security tests
        run: psql -h localhost -U postgres -d fiscal_rail_test -v ON_ERROR_STOP=1 -f supabase/test.sql
